<head>
<meta charset="utf-8">

<style>
/* Página inicial de forms: lista simples dos formulários abertos. Tema claro único, mesmos tokens dos formulários. */
:root {
  --bg: #ffffff;
  --ink: #1b2230;
  --muted: #66707e;
  --line: #cfd6e0;
  --accent: #003E91;
  --accent-soft: #e9eff8;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.5; }
main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; display: grid; gap: 1.5rem; }
h1 { margin: 0; font-size: 1.8rem; font-weight: 600; letter-spacing: -.01em; }
p { margin: 0; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
a { display: grid; gap: .15rem; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
a:hover { border-color: var(--accent); background: var(--accent-soft); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a strong { color: var(--accent); font-weight: 600; }
a span { color: var(--muted); font-size: .92rem; }
</style>
</head>
<body>
<main>
  <h1>Formulários</h1>
  <p>Inscrições abertas no momento.</p>
  <ul>
    <li><a href="festival-natal-foodtrucks/"><strong>Inscrição de Food Trucks · Festival de Natal Equatorial 2026</strong><span>Praça Maria Aragão, São Luís · 18 e 19/12</span></a></li>
    <li><a href="oficina-producao-eventos/"><strong>Oficina de Produção de Eventos 2026</strong><span>Auditório da Praça Maria Aragão · 09 e 10/12 · inscrições de 16/11 a 04/12</span></a></li>
  </ul>
</main>
</body>
</html>
